
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Care AI - Patient Form</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f7f9;
        }

        header {
            background: white;
            padding: 25px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        header h1 {
            margin: 0;
            font-size: 34px;
        }

        header p {
            color: #666;
        }

        .container {
            max-width: 800px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        h2 {
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 15px;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .links {
            margin-top: 20px;
            text-align: center;
        }

        .links a {
            margin: 5px;
            text-decoration: none;
        }

    </style>

</head>


<body>


<header>

    <h1>Care AI</h1>

    <p>
        AI-Powered Patient Case Management System
    </p>

</header>


<div class="container">


    <div class="card">

        <h2>Patient Information</h2>


        <form
            action="/submit"
            method="POST">


            <label for="patient_name">
                Patient Name
            </label>

            <input
                type="text"
                id="patient_name"
                name="patient_name"
                value="{{ patient.name if patient else '' }}"
                required>


            <label for="age">
                Age
            </label>

            <input
                type="number"
                id="age"
                name="age"
                value="{{ patient.age if patient else '' }}"
                required>


            <label for="gender">
                Gender
            </label>

            <select
                id="gender"
                name="gender"
                required>

                <option value="">
                    Select Gender
                </option>

                <option value="Male">
                    Male
                </option>

                <option value="Female">
                    Female
                </option>

                <option value="Other">
                    Other
                </option>

            </select>


            <label for="chief_complaint">
                Chief Complaint
            </label>

            <input
                type="text"
                id="chief_complaint"
                name="chief_complaint"
                value="{{ patient.chief_complaint if patient else '' }}"
                placeholder="Example: Fever"
                required>


            <label for="duration">
                Duration
            </label>

            <input
                type="text"
                id="duration"
                name="duration"
                value="{{ patient.duration if patient else '' }}"
                placeholder="Example: 2 days"
                required>


            <label for="symptoms">
                Symptoms
            </label>

            <textarea
                id="symptoms"
                name="symptoms"
                placeholder="Describe the symptoms">{{ patient.symptoms if patient else '' }}</textarea>


            <h2 style="margin-top:30px;">
                Medical History
            </h2>


            <label for="medical_history">
                Medical History
            </label>

            <textarea
                id="medical_history"
                name="medical_history"></textarea>


            <label for="surgical_history">
                Surgical History
            </label>

            <textarea
                id="surgical_history"
                name="surgical_history"></textarea>


            <label for="medications">
                Medications
            </label>

            <textarea
                id="medications"
                name="medications"></textarea>


            <label for="allergies">
                Allergies
            </label>

            <textarea
                id="allergies"
                name="allergies"></textarea>


            <label for="family_history">
                Family History
            </label>

            <textarea
                id="family_history"
                name="family_history"></textarea>


            <label for="personal_history">
                Personal History
            </label>

            <textarea
                id="personal_history"
                name="personal_history"></textarea>


            <button type="submit">
                Continue to Guided Clinical History
            </button>


        </form>


        <div class="links">

            <a href="/dashboard">
                Dashboard
            </a>

            |

            <a href="/records">
                Patient Records
            </a>

            |

            <a href="/ayush">
                AYUSH Form
            </a>

            |

            <a href="/upload">
                Upload Document
            </a>

        </div>


    </div>


</div>


</body>

</html>
