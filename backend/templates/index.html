<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MediKiosk - AI Clinical History</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7f9;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 850px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
        }

        h1 {
            text-align: center;
        }

        .subtitle {
            text-align: center;
            margin-bottom: 30px;
        }

        h2 {
            margin-top: 30px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 11px;
            margin-top: 6px;
            box-sizing: border-box;
        }

        textarea {
            min-height: 90px;
        }

        button {
            margin-top: 25px;
            padding: 13px 25px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>MediKiosk</h1>

    <p class="subtitle">
        AI-Assisted Clinical History Taking System
    </p>

    <form action="/submit" method="POST">

        <h2>1. Patient Information</h2>

        <label>Patient Name</label>
        <input type="text" name="patient_name" required>

        <label>Age</label>
        <input type="number" name="age" required>

        <label>Gender</label>
        <select name="gender">
            <option value="">Select Gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
        </select>

        <h2>2. Chief Complaint</h2>

        <label>What is your main health concern?</label>
        <textarea name="chief_complaint" required></textarea>

        <label>When did it start?</label>
        <input type="text" name="duration">

        <h2>3. Symptoms</h2>

        <label>Please describe your symptoms</label>
        <textarea name="symptoms" required></textarea>

        <h2>4. Medical History</h2>

        <label>Previous Medical Conditions</label>
        <textarea name="medical_history"></textarea>

        <label>Previous Surgeries</label>
        <textarea name="surgical_history"></textarea>

        <label>Current Medications</label>
        <textarea name="medications"></textarea>

        <label>Known Allergies</label>
        <textarea name="allergies"></textarea>

        <h2>5. Family History</h2>

        <label>Relevant Family Medical History</label>
        <textarea name="family_history"></textarea>

        <h2>6. Personal History</h2>

        <label>Other Relevant Information</label>
        <textarea name="personal_history"></textarea>

        <button type="submit">
            Submit Clinical History
        </button>

    </form>

</div>

</body>
</html>
