<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Care AI - Patient Case System</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                #0b0f14;

            color: #f5f7fa;
        }

        /* =========================
           TOP NAVBAR
        ========================= */

        .navbar {
            height: 72px;

            background: #11161d;

            border-bottom:
                1px solid #252c35;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 45px;

            position: sticky;
            top: 0;

            z-index: 10;
        }

        .logo {
            display: flex;

            align-items: center;

            gap: 12px;

            font-size: 22px;

            font-weight: 700;
        }

        .logo-icon {
            width: 38px;
            height: 38px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 10px;

            background: #f5f7fa;

            color: #11161d;

            font-size: 20px;

            font-weight: 800;
        }

        .nav-right {
            display: flex;

            align-items: center;

            gap: 10px;
        }

        .nav-icon {
            width: 38px;
            height: 38px;

            border-radius: 9px;

            display: flex;

            align-items: center;
            justify-content: center;

            background: #1a2028;

            border:
                1px solid #2a323c;

            color: #d9dee5;

            font-size: 16px;
        }

        /* =========================
           MAIN CONTAINER
        ========================= */

        .container {
            width: 100%;

            max-width: 1050px;

            margin: auto;

            padding:
                50px 25px 70px;
        }

        /* =========================
           HEADER
        ========================= */

        .page-header {
            margin-bottom: 35px;
        }

        .page-header h1 {
            margin: 0;

            font-size: 34px;

            letter-spacing: -0.5px;
        }

        .page-header p {
            margin-top: 10px;

            color: #8e98a5;

            font-size: 15px;
        }

        /* =========================
           FORM CARD
        ========================= */

        .card {
            background: #11161d;

            border:
                1px solid #252d37;

            border-radius: 16px;

            padding: 32px;

            box-shadow:
                0 15px 45px rgba(0, 0, 0, 0.25);
        }

        .card-header {
            margin-bottom: 28px;
        }

        .card-header h2 {
            margin: 0;

            font-size: 21px;
        }

        .card-header p {
            margin-top: 7px;

            color: #858f9c;

            font-size: 14px;
        }

        /* =========================
           FORM GRID
        ========================= */

        .form-grid {
            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 22px;
        }

        .form-group {
            display: flex;

            flex-direction: column;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        label {
            margin-bottom: 9px;

            color: #dce1e7;

            font-size: 14px;

            font-weight: 600;
        }

        input,
        select {
            width: 100%;

            padding: 14px 15px;

            background: #0c1117;

            color: #f5f7fa;

            border:
                1px solid #2a333e;

            border-radius: 9px;

            outline: none;

            font-size: 15px;

            transition:
                border-color 0.2s,
                box-shadow 0.2s,
                background 0.2s;
        }

        input::placeholder {
            color: #65707d;
        }

        input:hover,
        select:hover {
            background: #0f151c;
        }

        input:focus,
        select:focus {
            border-color: #6c7785;

            box-shadow:
                0 0 0 3px rgba(255, 255, 255, 0.05);
        }

        select {
            cursor: pointer;
        }

        select option {
            background: #11161d;

            color: #ffffff;
        }

        /* =========================
           SUBMIT AREA
        ========================= */

        .submit-area {
            margin-top: 32px;

            padding-top: 25px;

            border-top:
                1px solid #252d37;

            display: flex;

            justify-content: flex-end;
        }

        button {
            border: none;

            padding: 14px 32px;

            border-radius: 9px;

            background: #f1f3f5;

            color: #11161d;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;

            transition:
                transform 0.15s,
                background 0.2s;
        }

        button:hover {
            background: #ffffff;

            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        /* =========================
           RESULT
        ========================= */

        .result {
            margin-top: 20px;

            min-height: 20px;

            color: #aeb7c2;

            font-size: 14px;

            line-height: 1.6;
        }

        /* =========================
           FOOTER
        ========================= */

        .footer {
            margin-top: 25px;

            text-align: center;

            color: #59636f;

            font-size: 12px;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 700px) {

            .navbar {
                padding: 0 18px;
            }

            .container {
                padding:
                    35px 15px 50px;
            }

            .page-header h1 {
                font-size: 28px;
            }

            .card {
                padding: 22px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }

            .submit-area {
                justify-content: stretch;
            }

            button {
                width: 100%;
            }

        }

    </style>

</head>


<body>


<!-- =========================
     NAVIGATION
========================= -->

<header class="navbar">

    <div class="logo">

        <div class="logo-icon">
            C
        </div>

        <span>
            Care AI
        </span>

    </div>


    <div class="nav-right">

        <div class="nav-icon">
            ?
        </div>

        <div class="nav-icon">
            ☰
        </div>

    </div>

</header>


<!-- =========================
     MAIN CONTENT
========================= -->

<main class="container">


    <!-- PAGE HEADER -->

    <div class="page-header">

        <h1>
            Patient Case Taking
        </h1>

        <p>
            Enter patient information to begin the clinical assessment.
        </p>

    </div>


    <!-- =========================
         PATIENT FORM
    ========================= -->

    <section class="card">


        <div class="card-header">

            <h2>
                Patient Information
            </h2>

            <p>
                Please provide the basic details of the patient.
            </p>

        </div>


        <form id="patientForm">


            <div class="form-grid">


                <!-- NAME -->

                <div class="form-group">

                    <label for="name">
                        Patient Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter patient name"
                        required>

                </div>


                <!-- AGE -->

                <div class="form-group">

                    <label for="age">
                        Age
                    </label>

                    <input
                        type="number"
                        id="age"
                        placeholder="Enter age"
                        min="0"
                        required>

                </div>


                <!-- GENDER -->

                <div class="form-group">

                    <label for="gender">
                        Gender
                    </label>

                    <select id="gender">

                        <option value="Male">
                            Male
                        </option>

                        <option value="Female">
                            Female
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <!-- SYMPTOMS -->

                <div class="form-group">

                    <label for="symptoms">
                        Symptoms
                    </label>

                    <input
                        type="text"
                        id="symptoms"
                        placeholder="e.g. fever and tiredness"
                        required>

                </div>


            </div>


            <!-- SUBMIT -->

            <div class="submit-area">

                <button
                    type="submit">

                    Continue

                </button>

            </div>


        </form>


        <!-- RESULT -->

        <p
            id="result"
            class="result">
        </p>


    </section>


    <div class="footer">

        Care AI • AI Patient Case Taking System

    </div>


</main>


<!-- =========================
     JAVASCRIPT
========================= -->

<script>

    document
        .getElementById("patientForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();


            const result =
                document.getElementById("result");


            const patientData = {

                name:
                    document
                    .getElementById("name")
                    .value,

                age:
                    document
                    .getElementById("age")
                    .value,

                gender:
                    document
                    .getElementById("gender")
                    .value,

                symptoms:
                    document
                    .getElementById("symptoms")
                    .value

            };


            result.innerText =
                "Submitting patient information...";


            fetch(
                "http://127.0.0.1:5000/patient",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(patientData)
                }
            )

            .then(function(response) {

                if (!response.ok) {

                    throw new Error(
                        "Server returned an error"
                    );

                }

                return response.json();

            })

            .then(function(data) {

                result.innerText =
                    data.message ||
                    "Patient information submitted successfully.";

            })

            .catch(function(error) {

                console.error(error);

                result.innerText =
                    "Error connecting to backend. Make sure the Care AI server is running.";

            });

        });

</script>


</body>

</html>
